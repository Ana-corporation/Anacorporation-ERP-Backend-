# Creates / updates Cloud Run service anacorporation-erp-backend.
# Do not create this service in the Cloud Console with
# “Continuously deploy from a repository”.

name: Deploy to Cloud Run

on:
  push:
    branches: [development-anc]
  workflow_dispatch:

env:
  REGION: asia-southeast1
  SERVICE: anacorporation-erp-backend
  REPOSITORY: anacorporation-erp-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check WIF_PROVIDER format
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
        run: |
          # Must be: projects/NUMERIC_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
          # Project ID (project-b6b7f679-...) is invalid. Pool-only path is invalid.
          if [[ ! "${WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "WIF_PROVIDER is not the full Identity Provider resource name."
            echo "In Cloud Shell run:"
            echo "  gcloud iam workload-identity-pools providers describe github-provider \\"
            echo "    --project=project-b6b7f679-b5c2-42d8-bb4 \\"
            echo "    --location=global \\"
            echo "    --workload-identity-pool=github-pool \\"
            echo "    --format='value(name)'"
            echo "Paste that exact output into the WIF_PROVIDER GitHub secret (no quotes, no //iam.googleapis.com/ prefix)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud SQL APIs
        run: |
          gcloud services enable sqladmin.googleapis.com servicenetworking.googleapis.com serviceusage.googleapis.com --quiet \
            || echo "Could not enable APIs from CI. A project owner must turn on Cloud SQL Admin API in the GCP console."

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}" -t "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:latest" .
          docker push "${IMAGE}"
          docker push "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:latest"

      - name: Deploy Cloud Run service
        env:
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          GCP_SQL_USER: ${{ secrets.GCP_SQL_USER }}
          GCP_SQL_PASSWORD: ${{ secrets.GCP_SQL_PASSWORD }}
          GCP_SQL_DATABASE: ${{ secrets.GCP_SQL_DATABASE }}
          GCP_SQL_SCHEMA: ${{ secrets.GCP_SQL_SCHEMA }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import parse_qs, quote, unquote, urlparse

          def pair(key: str, value: str) -> str:
              return f"{key}: {json.dumps(value)}"

          instance = (
              os.environ.get("CLOUD_SQL_CONNECTION_NAME")
              or "project-b6b7f679-b5c2-42d8-bb4:asia-southeast1:swenter-db-dev"
          )

          def to_cloudsql_socket(raw: str) -> str:
              if not raw:
                  return raw
              if "/cloudsql/" in raw:
                  return raw
              parsed = urlparse(raw)
              user = unquote(parsed.username or "")
              password = unquote(parsed.password or "")
              database = (parsed.path or "/").lstrip("/") or "swenter-dev"
              schema = (parse_qs(parsed.query).get("schema") or ["Erp_test_db"])[0]
              return (
                  f"postgresql://{quote(user, safe='')}:{quote(password, safe='')}"
                  f"@localhost/{quote(database, safe='')}"
                  f"?host=/cloudsql/{instance}&schema={quote(schema, safe='')}"
              )

          frontend = os.environ["FRONTEND_ORIGIN"].rstrip("/")
          live = "https://anacorporation-erp-frontend-983704016599.europe-west1.run.app"
          origins = ",".join(dict.fromkeys([frontend, live]))
          database_url = to_cloudsql_socket(os.environ.get("DATABASE_URL", ""))
          direct_url = to_cloudsql_socket(os.environ.get("DIRECT_DATABASE_URL") or os.environ.get("DATABASE_URL", ""))
          lines = [
              pair("NODE_ENV", "production"),
              pair("API_PREFIX", "api/v1"),
              pair("FRONTEND_ORIGIN", origins),
              pair("CORS_ORIGIN", origins),
              pair("JWT_ACCESS_EXPIRATION", "8h"),
              pair("JWT_REFRESH_EXPIRATION", "7d"),
              pair("DATABASE_URL", database_url),
              pair("DIRECT_DATABASE_URL", direct_url),
              pair("JWT_SECRET", os.environ["JWT_SECRET"]),
              pair("GCP_SQL_INSTANCE_CONNECTION_NAME", instance),
          ]
          for key in ("GCP_SQL_USER", "GCP_SQL_PASSWORD", "GCP_SQL_DATABASE", "GCP_SQL_SCHEMA"):
              value = os.environ.get(key, "")
              if value:
                  lines.append(pair(key, value))
          Path("cloud-run-env.yaml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("cloud-sql-instance.txt").write_text(instance, encoding="utf-8")
          PY

          CLOUD_SQL_INSTANCE="$(cat cloud-sql-instance.txt)"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 5 \
            --cpu-boost \
            --add-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --startup-probe=tcpSocket.port=8080,periodSeconds=5,timeoutSeconds=2,failureThreshold=36 \
            --env-vars-file cloud-run-env.yaml

          rm -f cloud-run-env.yaml cloud-sql-instance.txt

      - name: Print service URL
        run: |
          URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')"
          echo "Backend URL: ${URL}"
          echo "Put this value in the frontend GitHub secret BACKEND_URL, then re-run the frontend workflow."

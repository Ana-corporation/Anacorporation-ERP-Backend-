services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_secret
      POSTGRES_DB: erp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-api
    restart: unless-stopped
    ports:
      - '3000:8080'
    env_file:
      - .env
    environment:
      PORT: '8080'
      DATABASE_URL: postgresql://erp:erp_secret@postgres:5432/erp_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro

volumes:
  postgres_data:
